name: Bambi1055 complete causal extension and four complete MAIN CI lanes
on:
  push:
    branches: [codex/validate-causal-extension-1055-main-i5]
permissions:
  contents: read
  actions: read
concurrency:
  group: bambi1055-main-attempt5
  cancel-in-progress: false
jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: [py312-cvm, py312-numba, py313-cvm, py313-numba, science-docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      G0_LANE: ${{ matrix.lane }}
    steps:
      - name: Record per-host network origin
        run: |
          python3 - <<'PYTIME'
          import os
          from pathlib import Path
          routes={s.split()[0]for s in Path('/proc/net/route').read_text().splitlines()[1:]if s.split()[1]=='00000000'}
          assert len(routes)==1
          interface=routes.pop();rx=(Path('/sys/class/net')/interface/'statistics/rx_bytes').read_text().strip()
          with open(os.environ['GITHUB_ENV'],'a')as f:f.write(f'M0_INTERFACE={interface}\nM0_RX_STARTED={rx}\n')
          PYTIME
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          path: packet
          persist-credentials: false
      - name: Exact workflow-created anchor including queue and setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 packet/validation/bambi1055/workflow_clock.py
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          repository: bambinos/bambi
          ref: babde99afb10a2b542e6c993074313ac2139f476
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Exact approved complete MAIN lane, same workflow deadline
        run: python3 packet/validation/bambi1055/hosted.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 3
        with:
          name: bambi1055-main-${{ github.run_id }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/bambi1055-main-${{ github.run_id }}-${{ matrix.lane }}/evidence
          if-no-files-found: warn
          retention-days: 7
