name: Validate Bambi558 fallback tests on main 93bc3ad attempt5
on:
  push:
    branches: [validate-bambi558-main-93bc3ad-a5]
permissions:
  contents: read
concurrency:
  group: bambi558-candidate-attempt5-93bc3ad
  cancel-in-progress: false
jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      started: ${{ steps.origin.outputs.started }}
    steps:
      - id: origin
        run: |
          python3 -I -B - <<'PYTIME'
          import os,time
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'started={time.time()}\n')
          PYTIME
  candidate:
    needs: origin
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: [py312-cvm, py312-numba, py313-cvm, py313-numba, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 59
    env:
      G0_LANE: ${{ matrix.lane }}
      M0_STARTED: ${{ needs.origin.outputs.started }}
    steps:
      - name: Record network origin under the shared deadline
        timeout-minutes: 1
        run: |
          python3 -I -B - <<'PYTIME'
          import os,sys,time
          from pathlib import Path
          if sys.flags.optimize: raise SystemExit('OPTIMIZE_FORBIDDEN')
          if not time.time() < float(os.environ['M0_STARTED']) + 3000: raise SystemExit('LANE_STARTED_AFTER_TARGET')
          routes = {s.split()[0] for s in Path('/proc/net/route').read_text().splitlines()[1:] if s.split()[1] == '00000000'}
          if len(routes) != 1: raise SystemExit('ROUTE_NOT_UNIQUE')
          interface = routes.pop()
          rx = (Path('/sys/class/net')/interface/'statistics/rx_bytes').read_text().strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'M0_INTERFACE={interface}\nM0_RX_STARTED={rx}\n')
          PYTIME
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          repository: bambinos/bambi
          ref: 93bc3ad44d2072c282f6d2a79dd64dd0f5da3bb1
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Candidate lane (exact reviewed test overlay, full upstream scope)
        timeout-minutes: 56
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 -I -B packet/validation/bambi558/hosted.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 3
        with:
          name: bambi558-a5-${{ github.run_id }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/bambi558-a5-${{ github.run_id }}-${{ matrix.lane }}/upload
          if-no-files-found: warn
          retention-days: 7
