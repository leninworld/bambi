name: Measure Bambi stable-main full native baseline attempt 2
on:
  push:
    branches: [validate-bambi558-main-g0-i2]
permissions:
  contents: read
concurrency:
  group: bambi558-g0-second-final
  cancel-in-progress: false
jobs:
  origin:
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    outputs:
      started: ${{ steps.origin.outputs.started }}
    steps:
      - id: origin
        run: |
          python3 - <<'PYTIME'
          import os,time
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'started={time.time()}\n')
          PYTIME
  baseline:
    needs: origin
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        lane: [py312-cvm, py312-numba, py313-cvm, py313-numba, docs]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      G0_LANE: ${{ matrix.lane }}
      M0_STARTED: ${{ needs.origin.outputs.started }}
    steps:
      - name: Record per-host network origin under the unchanged shared deadline
        run: |
          python3 - <<'PYTIME'
          import os,time
          from pathlib import Path
          assert time.time() < float(os.environ['M0_STARTED']) + 3000
          routes = {s.split()[0] for s in Path('/proc/net/route').read_text().splitlines()[1:] if s.split()[1] == '00000000'}
          assert len(routes) == 1
          interface = routes.pop()
          rx = (Path('/sys/class/net')/interface/'statistics/rx_bytes').read_text().strip()
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write(f'M0_INTERFACE={interface}\nM0_RX_STARTED={rx}\n')
          PYTIME
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          path: packet
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        timeout-minutes: 3
        with:
          repository: bambinos/bambi
          ref: f091d78049d91f566e420a26ffd3847568973b73
          path: upstream
          fetch-depth: 0
          persist-credentials: false
      - name: Required native lane; no source edits or skipped tests
        run: python3 packet/validation/bambi558/hosted.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        timeout-minutes: 3
        with:
          name: bambi558-g0-${{ github.run_id }}-${{ matrix.lane }}
          path: ${{ runner.temp }}/bambi558-m0-${{ github.run_id }}-${{ matrix.lane }}/upload
          if-no-files-found: warn
          retention-days: 7
